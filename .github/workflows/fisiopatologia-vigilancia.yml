name: Fisiopatologia — vigilância científica diária
on:
  schedule:
    - cron: '25 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fisiopatologia.js'
      - 'fisiopatologia.css'
      - 'tests/fisiopatologia.test.mjs'
      - '.github/workflows/fisiopatologia-vigilancia.yml'
permissions:
  contents: read
  issues: write
jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check fisiopatologia.js && node --test tests/fisiopatologia.test.mjs
      - uses: actions/github-script@v7
        with:
          script: |
            const q = 'asthma AND (FeNO OR eosinophil* OR "mucus plugs") AND (biologic* OR dupilumab OR mepolizumab OR benralizumab OR depemokimab OR tezepelumab) AND ("last 30 days"[edat])';
            const url = new URL('https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi');
            url.search = new URLSearchParams({db:'pubmed',term:q,retmode:'json',retmax:'50',sort:'date'});
            const response = await fetch(url,{signal:AbortSignal.timeout(30000)});
            if (!response.ok) throw new Error('PubMed: HTTP '+response.status);
            const ids = (await response.json()).esearchresult.idlist;
            if (!Array.isArray(ids)) throw new Error('Resposta PubMed inválida');
            const title = 'Fisiopatologia — triagem de novas evidências (PubMed)';
            const {owner,repo} = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo,{owner,repo,state:'open',per_page:100});
            const issue = issues.find(x=>x.title===title&&!x.pull_request);
            const body = 'Triagem automática diária de estudos indexados nos últimos 30 dias. Não constitui revisão médica nem altera condutas automaticamente. Revisar relevância, desenho, aplicabilidade e fontes antes de publicar.\n\n'+(ids.length?ids.map(id=>'- https://pubmed.ncbi.nlm.nih.gov/'+id+'/').join('\n'):'Nenhum resultado na busca atual.');
            if(issue && issue.body!==body) await github.rest.issues.update({owner,repo,issue_number:issue.number,body});
            else if(!issue) await github.rest.issues.create({owner,repo,title,body});
