name: Montar video da pagina Conheca o Hub
on:
  push:
    branches: [main]
    paths:
      - 'assets/hub-video-partes/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  montagem:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Montar arquivo MP4
        shell: bash
        run: |
          set -euo pipefail
          cat assets/hub-video-partes/parte-*.bin > assets/hub-demonstracao.mp4
          test "$(stat -c %s assets/hub-demonstracao.mp4)" -eq 3358634
          echo "eedbc5c2384dad8729f082e95b2195a3849dd4cf087150b631c35ff934bcf18b  assets/hub-demonstracao.mp4" | sha256sum -c -
      - name: Publicar arquivo no repositorio
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/hub-demonstracao.mp4
          if ! git diff --cached --quiet; then
            git commit -m 'Adicionar video da apresentacao do Hub'
            git push origin HEAD:main
          fi
