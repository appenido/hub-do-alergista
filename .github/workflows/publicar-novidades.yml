name: Novidades do Hub — atualização diária

on:
  schedule:
    # 09h25 no horário de Brasília (UTC-3), todos os dias.
    - cron: '25 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-novidades-do-hub
  cancel-in-progress: false

jobs:
  novidades:
    runs-on: ubuntu-latest
    steps:
      - name: Obter histórico completo do Hub
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validar critérios editoriais
        run: node --test tests/novidades-auto.test.mjs
      - name: Verificar novos conteúdos publicados
        run: node scripts/atualizar-novidades.mjs
      - name: Publicar atualização do feed
        run: |
          if ! git diff --quiet -- data/hub-novidades.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/hub-novidades.json
            git commit -m "chore(novidades): verificar publicações do Hub automaticamente"
            git push origin HEAD:main
          else
            echo "Feed já atualizado; não há alterações a publicar."
          fi
