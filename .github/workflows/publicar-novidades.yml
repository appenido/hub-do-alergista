name: Novidades do Hub — atualização diária

on:
  schedule:
    # 04h no horário de Brasília (UTC-3): mesma janela da auditoria diária.
    - cron: '0 7 * * *'
  workflow_dispatch:
  # Executar a primeira sincronização assim que esta rotina é alterada.
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-novidades.yml'
      - 'scripts/atualizar_uptodate.py'

permissions:
  contents: write

concurrency:
  group: publicar-novidades-do-hub
  cancel-in-progress: false

jobs:
  novidades:
    runs-on: ubuntu-latest
    steps:
      - name: Obter histórico completo do Hub
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preparar Python para índice público UpToDate
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar extração UpToDate
        run: python scripts/atualizar_uptodate.py --self-test
      # URLs alternativas públicas; rejeitar edições anteriores ao índice já publicado.
      - name: Verificar novidades públicas UpToDate
        id: uptodate
        continue-on-error: true
        run: python scripts/atualizar_uptodate.py
      - name: Registrar indisponibilidade da fonte sem fabricar novidades
        if: steps.uptodate.outcome == 'failure'
        run: echo "::warning::Fonte UpToDate indisponível. Mantida a verificação anterior e sem novos alertas dessa fonte."
      - name: Validar critérios editoriais
        run: node --test tests/novidades-auto.test.mjs
      - name: Verificar novos conteúdos publicados
        run: node scripts/atualizar-novidades.mjs
      - name: Publicar atualização do feed
        run: |
          if ! git diff --quiet -- data/hub-novidades.json data/uptodate.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/hub-novidades.json data/uptodate.json
            git commit -m "chore(novidades): auditoria diária Hub e UpToDate"
            for tentativa in 1 2 3; do
              if git push origin HEAD:main; then exit 0; fi
              echo "Tentativa de publicação $tentativa falhou; sincronizando alterações paralelas."
              git pull --rebase origin main
              sleep 3
            done
            echo "::error::Não foi possível publicar a conferência após 3 tentativas"
            exit 1
          else
            echo "Feed já atualizado; não há alterações a publicar."
          fi
