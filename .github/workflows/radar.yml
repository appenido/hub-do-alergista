name: Radar de notícias
on:
  schedule:
    - cron: '0 11 * * *'   # 08:00 America/Sao_Paulo (UTC-3)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/radar.mjs
      - name: Commit se houver mudança
        run: |
          git config user.name "radar-bot"
          git config user.email "radar@users.noreply.github.com"
          git add jornal/radar.json
          git diff --staged --quiet || git commit -m "Radar: atualiza notícias verificadas"
          git push
