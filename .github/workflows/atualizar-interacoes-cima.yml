name: Atualizar interações AEMPS/CIMA

on:
  schedule:
    - cron: '12 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-interacoes-cima
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Atualizar o índice oficial
        run: node scripts/atualizar-interacoes-cima.mjs
      - name: Validar a atualização
        run: node --test tests/interacoes.test.mjs
      - name: Publicar somente quando a fonte mudar
        run: |
          if git diff --quiet -- data/interacoes-cima.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/interacoes-cima.json
          git commit -m 'Atualiza o índice de interações da AEMPS/CIMA'
          for tentativa in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
