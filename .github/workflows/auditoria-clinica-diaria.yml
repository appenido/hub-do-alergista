name: Auditoria clínica automática — 04h
on:
  schedule:
    # 04:00 America/Sao_Paulo = 07:00 UTC (sem horário de verão).
    - cron: '0 7 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'protocolos-bolso-condutas-20261114.js'
      - 'scripts/auditar-protocolos.mjs'
      - 'data/baseline-lacunas-clinicas.json'
  push:
    branches: [main]
    paths:
      - 'protocolos-bolso-condutas-20261114.js'
      - 'scripts/auditar-protocolos.mjs'
      - 'data/baseline-lacunas-clinicas.json'
      - 'AUDITORIA-CLINICA-PROMPT-MESTRE.md'
      - '.github/workflows/auditoria-clinica-diaria.yml'

permissions:
  contents: read
  issues: write

jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Gerar inventário de lacunas clínicas
        run: node scripts/auditar-protocolos.mjs
      - name: Preservar relatório auditável
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-auditoria-clinica
          path: audit-output/
          retention-days: 30
      - name: Registrar pendências em issue única e atualizável
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const obj = JSON.parse(fs.readFileSync('audit-output/relatorio-clinico.json','utf8'));
            const report = fs.readFileSync('audit-output/relatorio-clinico.md','utf8');
            const title = 'Auditoria clínica automática — posologias e critérios pendentes';
            const {owner,repo} = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo,{owner,repo,state:'open',per_page:100});
            const issue = issues.find(x=>x.title===title&&!x.pull_request);
            const body = 'Relatório gerado automaticamente por verificação estática; não equivale a validação médica ou regulatória.\n\n'+report;
            if(obj.summary.outstanding>0){
              if(issue) await github.rest.issues.update({owner,repo,issue_number:issue.number,body});
              else await github.rest.issues.create({owner,repo,title,body});
            } else if(issue){
              await github.rest.issues.update({owner,repo,issue_number:issue.number,state:'closed',body:'Sem pendências detectadas na auditoria estática atual.\n\n'+report});
            }
      - name: Bloquear introdução de novas lacunas em alterações de código
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: node scripts/auditar-protocolos.mjs --fail-on-new
