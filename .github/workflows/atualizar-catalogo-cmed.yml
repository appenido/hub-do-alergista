name: Atualizar catálogo de apresentações CMED
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Consultar lista oficial CMED e reconstruir apresentações
        run: python scripts/atualizar-apresentacoes.py
      - name: Testes de concentrações, apresentações e segurança
        run: node --test tests/medicamentos-dose-catalogo.test.mjs tests/medicamentos-dose.test.mjs
      - name: Publicar somente se a fonte mudou e passou nos testes
        run: |
          if git diff --quiet -- data/medicamentos-apresentacoes.json; then
            echo 'Sem alteração no arquivo oficial da CMED.'
            exit 0
          fi
          git config user.name 'Hub Clínico Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/medicamentos-apresentacoes.json
          git commit -m 'data: atualizar apresentações oficiais CMED'
          git push
