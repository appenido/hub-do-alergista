name: Testes de estabilidade do Hub
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  regressao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Testes automatizados
        run: node --test tests/estabilidade.test.mjs
